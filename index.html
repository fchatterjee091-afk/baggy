<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baggy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{height:100%}
  body{
    margin:0;
    background:#ffffff;
    color:#000000;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:6vh 5vw;
    box-sizing:border-box;
    font-family:"Quicksand","Century Gothic",Futura,"Trebuchet MS",sans-serif;
  }
  p{
    margin:0;
    font-weight:500;
    font-size:clamp(1.5rem,5.4vw,4rem);
    line-height:1.34;
    letter-spacing:0.005em;
    text-align:center;
    max-width:22ch;
  }
</style>
</head>
<body>
  <p>Baggy is<br>
  a paper bags<br>
  manufacturing<br>
  company<br>
  which provides<br>
  eco friendly bags<br>
  targeting to<br>
  eliminate<br>
  single used plastic</p>
</body>
</html>
